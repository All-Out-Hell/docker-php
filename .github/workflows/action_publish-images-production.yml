name: Docker Publish (Production Images)

on:
  workflow_dispatch:
  release:
    types: [released]
  schedule:
    - cron: '0 8 * * 2'

jobs:
  get-latest-release:
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.get_latest_release.outputs.release_tag }}
    permissions:
      contents: read
    steps:
      - name: Get Latest Release
        id: get_latest_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_TAG=$(gh release view --repo "${{ github.repository }}" --json tagName --jq .tagName)
          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            echo "Could not determine the latest release tag" 1>&2
            exit 1
          fi
          echo "release_tag=${LATEST_TAG}" >> $GITHUB_OUTPUT

  build-production-images:
    permissions:
      contents: read
      packages: write
      id-token: write
    needs: get-latest-release
    uses: ./.github/workflows/service_docker-build-and-publish.yml
    with:
      registry-repositories: ghcr.io/all-out-hell/docker-php
      tag-prefix: ''
      release-type: "latest"
      ref: ${{ needs.get-latest-release.outputs.release_tag }}
    secrets: inherit
